<style>
.hm-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: hmBlink 8s ease-in-out infinite;
}
/* 8s 一次：慢慢闭上(~0.4s)→眯一会儿(~0.2s)→慢慢睁开(~0.5s)，呆萌感 */
@keyframes hmBlink {
  0%, 87% { transform: scaleY(1); }
  92%, 94% { transform: scaleY(0.08); }
  100% { transform: scaleY(1); }
}
</style>

